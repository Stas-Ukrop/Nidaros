<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nidaros Mail Assistant</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 16px;
            font-family: Arial, sans-serif;
            color: #242424;
            background: #fff;
        }

        h2 { margin: 0 0 8px; }
        h3 { margin: 20px 0 10px; font-size: 16px; }

        #status {
            margin: 0 0 16px;
            color: #666;
        }

        #status.error { color: #a1261b; font-weight: 600; }

        button {
            width: 100%;
            padding: 12px 16px;
            background: #176b52;
            color: #fff;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        button:disabled {
            opacity: .5;
            cursor: wait;
        }

        button.secondary {
            width: auto;
            padding: 6px 10px;
            background: #eee;
            color: #242424;
            font-size: 12px;
        }

        .files-box {
            display: grid;
            gap: 10px;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .files-box label { font-size: 13px; }

        .files-box input[type="file"] {
            width: 100%;
            font: inherit;
            font-size: 13px;
        }

        .hint {
            margin: 0;
            font-size: 12px;
            color: #777;
        }

        #fileList {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 6px;
        }

        #fileList:empty { display: none; }

        #fileList li {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 6px 8px;
            background: #f7f7f7;
            border-radius: 5px;
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        /* Alleen-lezen velden: worden door de server gevuld */
        .field {
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid #e1e1e1;
            border-radius: 6px;
        }

        .field-head {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            align-items: center;
            margin-bottom: 4px;
        }

        .field-label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
        }

        .field-value {
            min-height: 20px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .field-value.empty { color: #aaa; }

        .field-note {
            margin-top: 4px;
            font-size: 12px;
            color: #8a5a00;
        }

        .field-note:empty { display: none; }

        .confidence {
            padding: 3px 7px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .neutral { background: #eee; color: #555; }
        .green { background: #dff4e8; color: #176b52; }
        .orange { background: #fff0cf; color: #8a5a00; }
        .red { background: #fde1df; color: #a1261b; }

        details {
            margin-top: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        summary {
            padding: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .json-tools {
            display: flex;
            justify-content: flex-end;
            padding: 0 10px;
        }

        pre {
            margin: 10px;
            padding: 10px;
            max-height: 400px;
            overflow: auto;
            background: #f5f5f5;
            border-radius: 6px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <h2>Nidaros Mail Assistant</h2>
    <p id="status">Outlook wordt gestart...</p>

    <h3>Bestanden (PDF / DOCX / XML)</h3>

    <div class="files-box">
        <label>
            <input type="checkbox" id="useAttachments" checked>
            PDF/DOCX/XML bijlagen uit deze e-mail meenemen
        </label>

        <label for="fileInput">Of kies bestanden van uw computer:</label>
        <input
            id="fileInput"
            type="file"
            accept=".pdf,.docx,.xml,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/xml,text/xml"
            multiple>

        <p class="hint">Maximaal 10 MB per bestand. Gescande PDF's zonder tekstlaag worden niet gelezen.</p>

        <ul id="fileList"></ul>
    </div>

    <button id="analyze" disabled>Gegevens ophalen</button>

    <h3>Gegevens</h3>

    <!-- Velden worden uit FIELDS gegenereerd -->
    <div id="fields"></div>

    <details id="jsonBox" open>
        <summary>Volledige JSON</summary>
        <div class="json-tools">
            <button id="copyJson" class="secondary" type="button">Kopiëren</button>
        </div>
        <pre id="result">Nog geen gegevens.</pre>
    </details>

    <script>
        const MAX_FILE_BYTES = 10 * 1024 * 1024;

        // Velden volgens de opdracht (key = naam in de API-respons)
        const FIELDS = [
            ["name", "Naam"],
            ["address", "Adres"],
            ["postalCode", "Postcode"],
            ["city", "Woonplaats"],
            ["iban", "IBAN"],
            ["customerType", "Nieuwe klant of bestaande klant"],
            ["kvk", "KVK nummer"],
            ["vat", "BTW nummer"],
            ["invoiceNumber", "Factuurnummer"],
            ["article", "Welk artikel"],
            ["quantity", "Hoeveelheid"],
            ["deliveryDate", "Datum afname"],
            ["paymentDueDate", "Uiterste betalingsdatum"],
            ["paymentArrears", "Betalingsachterstanden binnen de eigen company"]
        ];

        const CUSTOMER_TYPE_LABELS = {
            new: "Nieuwe klant",
            existing: "Bestaande klant"
        };

        const button = document.getElementById("analyze");
        const status = document.getElementById("status");
        const result = document.getElementById("result");
        const fieldsBox = document.getElementById("fields");
        const fileInput = document.getElementById("fileInput");
        const useAttachments = document.getElementById("useAttachments");
        const fileList = document.getElementById("fileList");
        const copyJson = document.getElementById("copyJson");

        const setStatus = (text, isError = false) => {
            status.textContent = text;
            status.classList.toggle("error", isError);
        };

        // Velden opbouwen (alleen-lezen)
        FIELDS.forEach(([key, label]) => {
            const field = document.createElement("div");
            field.className = "field";
            field.dataset.key = key;
            field.innerHTML = `
                <div class="field-head">
                    <span class="field-label"></span>
                    <span class="confidence neutral">Niet gecontroleerd</span>
                </div>
                <div class="field-value empty">—</div>
                <div class="field-note"></div>
            `;
            field.querySelector(".field-label").textContent = label;
            fieldsBox.append(field);
        });

        const confidenceState = confidence =>
            confidence === 100
                ? ["green", "100% zeker"]
                : confidence >= 75
                    ? ["orange", `${confidence}% twijfel`]
                    : confidence > 0
                        ? ["red", "Niet gevonden"]
                        : ["neutral", "Niet gecontroleerd"];

        const setField = (key, field) => {
            const container = fieldsBox.querySelector(`[data-key="${key}"]`);
            if (!container) return;

            const valueEl = container.querySelector(".field-value");
            const badge = container.querySelector(".confidence");
            const noteEl = container.querySelector(".field-note");

            let value = field?.value ?? "";
            if (key === "customerType") value = CUSTOMER_TYPE_LABELS[value] ?? value;

            valueEl.textContent = value || "—";
            valueEl.classList.toggle("empty", !value);

            // Uitleg van de server (bv. "IBAN-controlegetal klopt niet."), niet bij "missing"
            noteEl.textContent = field?.status !== "missing" ? (field?.note ?? "") : "";

            const [state, label] = confidenceState(Number(field?.confidence ?? 0));
            badge.className = `confidence ${state}`;
            badge.textContent = label;
        };

        const resetFields = () => FIELDS.forEach(([key]) => setField(key, null));

        // PDF, DOCX, XML (oude .doc niet)
        const isSupported = (name = "", type = "") =>
            /\.(pdf|xml|docx)$/i.test(name) || /pdf|xml|wordprocessingml/i.test(type);

        const isOldDoc = (name = "", type = "") =>
            /\.doc$/i.test(name) || type === "application/msword";

        const formatSize = bytes =>
            bytes > 1024 * 1024
                ? `${(bytes / 1024 / 1024).toFixed(1)} MB`
                : `${Math.max(1, Math.round(bytes / 1024))} KB`;

        const renderFileList = items => {
            fileList.innerHTML = "";

            items.forEach(item => {
                const li = document.createElement("li");
                const left = document.createElement("span");
                const right = document.createElement("span");

                const sourceLabel = item.source === "attachment" ? "bijlage" : "upload";
                left.textContent = `${item.name} (${sourceLabel}${item.size ? ", " + formatSize(item.size) : ""})`;
                right.textContent = item.note ?? "";

                li.append(left, right);
                fileList.append(li);
            });
        };

        const previewSelection = () => {
            const items = [];
            const item = Office.context?.mailbox?.item;

            if (useAttachments.checked && item) {
                (item.attachments ?? [])
                    .filter(a => !a.isInline && isSupported(a.name, a.contentType))
                    .forEach(a => items.push({ name: a.name, size: a.size, source: "attachment" }));
            }

            Array.from(fileInput.files ?? []).forEach(f => items.push({
                name: f.name,
                size: f.size,
                source: "upload",
                note: isOldDoc(f.name, f.type)
                    ? "sla op als .docx"
                    : isSupported(f.name, f.type) ? "" : "niet ondersteund"
            }));

            renderFileList(items);
        };

        const readLocalFile = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result).split(",")[1] ?? "");
            reader.onerror = () => reject(new Error(`Kan ${file.name} niet lezen.`));
            reader.readAsDataURL(file);
        });

        // Outlook-bijlage -> base64 (vereist Mailbox 1.8)
        const readAttachment = (item, attachmentId) => new Promise((resolve, reject) => {
            item.getAttachmentContentAsync(attachmentId, response => {
                if (response.status !== Office.AsyncResultStatus.Succeeded) {
                    reject(new Error(response.error.message));
                    return;
                }

                const { format, content } = response.value;

                if (format === Office.MailboxEnums.AttachmentContentFormat.Base64) {
                    resolve(content);
                } else {
                    reject(new Error(`Onverwacht bijlageformaat: ${format}`));
                }
            });
        });

        const collectFiles = async item => {
            const files = [];
            const skipped = [];

            if (useAttachments.checked) {
                const candidates = (item.attachments ?? [])
                    .filter(a => !a.isInline && isSupported(a.name, a.contentType));

                if (candidates.length > 0 &&
                    !Office.context.requirements.isSetSupported("Mailbox", "1.8")) {
                    skipped.push("Bijlagen lezen wordt niet ondersteund in deze Outlook-versie.");
                } else {
                    for (const a of candidates) {
                        if (a.size > MAX_FILE_BYTES) {
                            skipped.push(`${a.name}: te groot`);
                            continue;
                        }

                        files.push({
                            name: a.name,
                            contentType: a.contentType ?? "",
                            base64: await readAttachment(item, a.id),
                            source: "attachment"
                        });
                    }
                }
            }

            for (const f of Array.from(fileInput.files ?? [])) {
                if (isOldDoc(f.name, f.type)) {
                    skipped.push(`${f.name}: oud .doc-formaat, sla op als .docx`);
                    continue;
                }

                if (!isSupported(f.name, f.type)) {
                    skipped.push(`${f.name}: alleen PDF, DOCX of XML`);
                    continue;
                }

                if (f.size > MAX_FILE_BYTES) {
                    skipped.push(`${f.name}: te groot`);
                    continue;
                }

                files.push({
                    name: f.name,
                    contentType: f.type ?? "",
                    base64: await readLocalFile(f),
                    source: "upload"
                });
            }

            return { files, skipped };
        };

        fileInput.addEventListener("change", previewSelection);
        useAttachments.addEventListener("change", previewSelection);

        copyJson.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(result.textContent);
                copyJson.textContent = "Gekopieerd ✓";
            } catch {
                // Fallback: tekst selecteren zodat de gebruiker Ctrl+C kan doen
                const range = document.createRange();
                range.selectNodeContents(result);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                copyJson.textContent = "Geselecteerd — Ctrl+C";
            }

            setTimeout(() => { copyJson.textContent = "Kopiëren"; }, 2000);
        });

        Office.onReady(info => {
            if (info.host !== Office.HostType.Outlook) {
                setStatus("Open deze pagina in Outlook.");
                return;
            }

            setStatus("Outlook is klaar.");
            button.disabled = false;
            previewSelection();
        });

        button.addEventListener("click", async () => {
            button.disabled = true;
            setStatus("Gegevens worden opgehaald...");
            resetFields();
            result.textContent = "Bezig...";

            try {
                const item = Office.context.mailbox.item;

                if (!item) {
                    throw new Error("Geen e-mail geselecteerd.");
                }

                const body = await new Promise((resolve, reject) => {
                    item.body.getAsync(
                        Office.CoercionType.Text,
                        response => response.status === Office.AsyncResultStatus.Succeeded
                            ? resolve(response.value)
                            : reject(new Error(response.error.message))
                    );
                });

                setStatus("Bestanden worden gelezen...");
                const { files, skipped } = await collectFiles(item);

                setStatus("Gegevens worden geanalyseerd...");

                const response = await fetch("/api/mail/analyze", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        itemId: item.itemId,
                        subject: item.subject,
                        sender: item.from?.emailAddress,
                        body,
                        attachments: (item.attachments ?? []).map(file => ({
                            id: file.id,
                            name: file.name,
                            size: file.size,
                            contentType: file.contentType ?? ""
                        })),
                        files
                    })
                });

                const data = await response.json().catch(() => null);

                if (!response.ok) {
                    result.textContent = data ? JSON.stringify(data, null, 2) : "";
                    throw new Error(`Server error ${response.status}: ${data?.error ?? response.statusText}`);
                }

                FIELDS.forEach(([key]) => setField(key, data?.fields?.[key]));

                renderFileList([
                    ...(data.files ?? []).map(f => ({
                        name: f.name,
                        source: f.source,
                        note: f.error ? `fout: ${f.error}` : `${f.characters} tekens gelezen`
                    })),
                    ...skipped.map(s => ({ name: s, source: "upload", note: "overgeslagen" }))
                ]);

                result.textContent = JSON.stringify(data, null, 2);

                setStatus(data.readyToSend
                    ? "Alle gegevens gevonden."
                    : "Gegevens ontvangen. Controleer de velden zonder groen label.");
            } catch (error) {
                setStatus(error.message, true);
                if (result.textContent === "Bezig...") result.textContent = error.message;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
