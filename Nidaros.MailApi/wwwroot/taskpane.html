<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nidaros Mail Assistant</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 16px;
            font-family: Arial, sans-serif;
            color: #242424;
            background: #fff;
        }

        h2 { margin: 0 0 8px; }
        h3 { margin: 20px 0 10px; font-size: 16px; }

        #status {
            margin: 0 0 16px;
            color: #666;
        }

        #status.error { color: #a1261b; font-weight: 600; }

        button {
            width: 100%;
            padding: 12px 16px;
            background: #176b52;
            color: #fff;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        button:disabled {
            opacity: .5;
            cursor: wait;
        }

        button.secondary {
            width: auto;
            padding: 6px 10px;
            background: #eee;
            color: #242424;
            font-size: 12px;
        }

        .files-box {
            display: grid;
            gap: 10px;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .files-box label { font-size: 13px; }

        .modes {
            display: grid;
            gap: 8px;
        }

        .mode {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
        }

        .mode:has(input:checked) {
            border-color: #176b52;
            background: #f1f8f5;
        }

        .hidden { display: none !important; }

        .files-box input[type="file"] {
            width: 100%;
            font: inherit;
            font-size: 13px;
        }

        .hint {
            margin: 0;
            font-size: 12px;
            color: #777;
        }

        #fileList {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 6px;
        }

        #fileList:empty { display: none; }

        #fileList li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            background: #f7f7f7;
            border-radius: 5px;
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        #fileList li.unchecked { opacity: .6; }

        .file-pick {
            display: flex;
            gap: 8px;
            align-items: center;
            cursor: pointer;
            min-width: 0;
        }

        .file-pick input { flex: none; margin: 0; }

        .file-note {
            flex: none;
            max-width: 45%;
            text-align: right;
            color: #555;
        }

        .file-note.error { color: #a1261b; }

        /* Alleen-lezen velden: worden door de server gevuld */
        .field {
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid #e1e1e1;
            border-radius: 6px;
        }

        .field-head {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            align-items: center;
            margin-bottom: 4px;
        }

        .field-label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
        }

        .field-value {
            min-height: 20px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .field-value.empty { color: #aaa; }

        .field-note {
            margin-top: 4px;
            font-size: 12px;
            color: #8a5a00;
        }

        .field-note:empty { display: none; }

        .confidence {
            padding: 3px 7px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .neutral { background: #eee; color: #555; }
        .green { background: #dff4e8; color: #176b52; }
        .orange { background: #fff0cf; color: #8a5a00; }
        .red { background: #fde1df; color: #a1261b; }

        details {
            margin-top: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        summary {
            padding: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .json-tools {
            display: flex;
            justify-content: flex-end;
            padding: 0 10px;
        }

        pre {
            margin: 10px;
            padding: 10px;
            max-height: 400px;
            overflow: auto;
            background: #f5f5f5;
            border-radius: 6px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <h2>Nidaros Mail Assistant</h2>
    <p id="status">Outlook wordt gestart...</p>

    <h3>Bron van bestanden (PDF / DOCX / XML)</h3>

    <div class="files-box">
        <div class="modes">
            <label class="mode">
                <input type="radio" name="fileMode" value="mail" checked>
                Bijlagen uit deze e-mail
            </label>

            <label class="mode">
                <input type="radio" name="fileMode" value="pc">
                Bestand van computer
            </label>
        </div>

        <div id="pcBox" class="hidden">
            <input
                id="fileInput"
                type="file"
                accept=".pdf,.docx,.xml,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/xml,text/xml">
        </div>

        <p id="modeHint" class="hint"></p>

        <ul id="fileList"></ul>


        <p class="hint">Maximaal 10 MB per bestand. Gescande PDF's zonder tekstlaag worden niet gelezen.</p>
    </div>

    <button id="analyze" disabled>Gegevens ophalen</button>

    <h3>Gegevens</h3>

    <!-- Velden worden uit FIELDS gegenereerd -->
    <div id="fields"></div>

    <details id="jsonBox" open>
        <summary>Volledige JSON</summary>
        <div class="json-tools">
            <button id="copyJson" class="secondary" type="button">Kopiëren</button>
        </div>
        <pre id="result">Nog geen gegevens.</pre>
    </details>

    <script>
        const MAX_FILE_BYTES = 10 * 1024 * 1024;

        // Velden volgens de opdracht (key = naam in de API-respons)
        const FIELDS = [
            ["name", "Naam"],
            ["address", "Adres"],
            ["postalCode", "Postcode"],
            ["city", "Woonplaats"],
            ["iban", "IBAN"],
            ["customerType", "Nieuwe klant of bestaande klant"],
            ["kvk", "KVK nummer"],
            ["vat", "BTW nummer"],
            ["invoiceNumber", "Factuurnummer"],
            ["article", "Welk artikel"],
            ["quantity", "Hoeveelheid"],
            ["deliveryDate", "Datum afname"],
            ["paymentDueDate", "Uiterste betalingsdatum"],
            ["paymentArrears", "Betalingsachterstanden binnen de eigen company"]
        ];

        const CUSTOMER_TYPE_LABELS = {
            new: "Nieuwe klant",
            existing: "Bestaande klant"
        };

        const button = document.getElementById("analyze");
        const status = document.getElementById("status");
        const result = document.getElementById("result");
        const fieldsBox = document.getElementById("fields");
        const fileInput = document.getElementById("fileInput");
        const pcBox = document.getElementById("pcBox");
        const modeHint = document.getElementById("modeHint");

        // "mail" = bijlagen uit de e-mail, "pc" = bestand van computer
        const fileMode = () => document.querySelector('input[name="fileMode"]:checked').value;

        const canReadAttachments = () =>
            Office.context?.requirements?.isSetSupported("Mailbox", "1.8") ?? false;

        const mailAttachments = item =>
            (item?.attachments ?? []).filter(a => !a.isInline && isSupported(a.name, a.contentType));
        const fileList = document.getElementById("fileList");
        const copyJson = document.getElementById("copyJson");

        const setStatus = (text, isError = false) => {
            status.textContent = text;
            status.classList.toggle("error", isError);
        };

        // Velden opbouwen (alleen-lezen)
        FIELDS.forEach(([key, label]) => {
            const field = document.createElement("div");
            field.className = "field";
            field.dataset.key = key;
            field.innerHTML = `
                <div class="field-head">
                    <span class="field-label"></span>
                    <span class="confidence neutral">Niet gecontroleerd</span>
                </div>
                <div class="field-value empty">—</div>
                <div class="field-note"></div>
            `;
            field.querySelector(".field-label").textContent = label;
            fieldsBox.append(field);
        });

        const confidenceState = confidence =>
            confidence === 100
                ? ["green", "100% zeker"]
                : confidence >= 75
                    ? ["orange", `${confidence}% twijfel`]
                    : confidence > 0
                        ? ["red", "Niet gevonden"]
                        : ["neutral", "Niet gecontroleerd"];

        const setField = (key, field) => {
            const container = fieldsBox.querySelector(`[data-key="${key}"]`);
            if (!container) return;

            const valueEl = container.querySelector(".field-value");
            const badge = container.querySelector(".confidence");
            const noteEl = container.querySelector(".field-note");

            let value = field?.value ?? "";
            if (key === "customerType") value = CUSTOMER_TYPE_LABELS[value] ?? value;

            valueEl.textContent = value || "—";
            valueEl.classList.toggle("empty", !value);

            // Uitleg van de server (bv. "IBAN-controlegetal klopt niet."), niet bij "missing"
            noteEl.textContent = field?.status !== "missing" ? (field?.note ?? "") : "";

            const [state, label] = field?.status === "error"
                ? ["red", "Fout"]
                : confidenceState(Number(field?.confidence ?? 0));
            badge.className = `confidence ${state}`;
            badge.textContent = label;
        };

        const resetFields = () => FIELDS.forEach(([key]) => setField(key, null));

        // PDF, DOCX, XML (oude .doc niet)
        const isSupported = (name = "", type = "") =>
            /\.(pdf|xml|docx)$/i.test(name) || /pdf|xml|wordprocessingml/i.test(type);

        const isOldDoc = (name = "", type = "") =>
            /\.doc$/i.test(name) || type === "application/msword";

        const formatSize = bytes =>
            bytes > 1024 * 1024
                ? `${(bytes / 1024 / 1024).toFixed(1)} MB`
                : `${Math.max(1, Math.round(bytes / 1024))} KB`;

        // Er wordt precies één bestand verwerkt.
        // Sleutel: "att:<id>" voor een bijlage, "pc:<naam>:<grootte>" voor een bestand van de computer.
        let selectedKey = null;

        // Resultaat na de laatste analyse: sleutel → { text, error }
        let fileNotes = new Map();

        const renderFileList = items => {
            fileList.innerHTML = "";

            // Keuzerondje alleen als er bij bijlagen echt iets te kiezen is
            const showPicker = fileMode() === "mail" && items.some(i => i.selectable);

            items.forEach(item => {
                const li = document.createElement("li");
                const pick = document.createElement("label");
                const name = document.createElement("span");
                const note = document.createElement("span");

                pick.className = "file-pick";
                note.className = "file-note";

                const sourceLabel = item.source === "attachment" ? "bijlage" : "upload";
                name.textContent = `${item.name} (${sourceLabel}${item.size ? ", " + formatSize(item.size) : ""})`;

                const isChosen = item.selectable && item.key === selectedKey;

                if (showPicker) {
                    const radio = document.createElement("input");
                    radio.type = "radio";
                    radio.name = "attachmentPick";
                    radio.checked = isChosen;
                    radio.disabled = !item.selectable;
                    radio.addEventListener("change", () => {
                        selectedKey = item.key;
                        previewSelection();
                    });
                    pick.append(radio);
                }

                li.classList.toggle("unchecked", !isChosen);
                pick.append(name);

                const result = fileNotes.get(item.key);
                note.textContent = result?.text ?? item.note ?? "";
                note.classList.toggle("error", Boolean(result?.error) || (!item.selectable && Boolean(item.note)));

                li.append(pick, note);
                fileList.append(li);
            });
        };

        const updateHint = items => {
            const selectable = items.filter(i => i.selectable).length;
            const chosen = items.find(i => i.selectable && i.key === selectedKey);

            if (fileMode() === "mail" && !canReadAttachments()) {
                modeHint.textContent = "Deze Outlook-versie kan bijlagen niet lezen. Kies 'Bestand van computer'.";
            } else if (fileMode() === "mail") {
                modeHint.textContent = selectable === 0
                    ? "Geen PDF/DOCX/XML bijlagen in deze e-mail. Alleen de tekst van de e-mail wordt gelezen."
                    : selectable === 1
                        ? "Het bestand wordt direct uit de e-mail gelezen, zonder downloaden."
                        : `Kies één van de ${selectable} bijlagen om te verwerken.`;
            } else {
                modeHint.textContent = items.length === 0
                    ? "Kies één bestand. Bijlagen uit de e-mail worden genegeerd."
                    : chosen ? "" : "Dit bestand kan niet worden verwerkt. Kies een ander bestand.";
            }
        };

        // Huidige lijst bestanden voor de gekozen modus
        const currentItems = () => {
            const item = Office.context?.mailbox?.item;

            if (fileMode() === "mail") {
                return mailAttachments(item).map(a => ({
                    key: `att:${a.id}`,
                    name: a.name,
                    size: a.size,
                    source: "attachment",
                    selectable: a.size <= MAX_FILE_BYTES,
                    note: a.size > MAX_FILE_BYTES ? "te groot" : ""
                }));
            }

            const f = fileInput.files?.[0];

            if (!f) return [];

            const problem = isOldDoc(f.name, f.type)
                ? "sla op als .docx"
                : !isSupported(f.name, f.type)
                    ? "niet ondersteund"
                    : f.size > MAX_FILE_BYTES ? "te groot" : "";

            return [{
                key: `pc:${f.name}:${f.size}`,
                name: f.name,
                size: f.size,
                source: "upload",
                selectable: !problem,
                note: problem,
                file: f
            }];
        };

        // Keuze ongeldig of nog niet gemaakt → eerste bruikbare bestand
        const ensureSelection = items => {
            if (!items.some(i => i.selectable && i.key === selectedKey)) {
                selectedKey = items.find(i => i.selectable)?.key ?? null;
            }
        };

        const previewSelection = () => {
            pcBox.classList.toggle("hidden", fileMode() !== "pc");

            const items = currentItems();
            ensureSelection(items);
            renderFileList(items);
            updateHint(items);
        };

        const readLocalFile = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result).split(",")[1] ?? "");
            reader.onerror = () => reject(new Error(`Kan ${file.name} niet lezen.`));
            reader.readAsDataURL(file);
        });

        // Outlook-bijlage -> base64 (vereist Mailbox 1.8)
        const readAttachment = (item, attachmentId) => new Promise((resolve, reject) => {
            item.getAttachmentContentAsync(attachmentId, response => {
                if (response.status !== Office.AsyncResultStatus.Succeeded) {
                    reject(new Error(response.error.message));
                    return;
                }

                const { format, content } = response.value;

                if (format === Office.MailboxEnums.AttachmentContentFormat.Base64) {
                    resolve(content);
                } else {
                    reject(new Error(`Onverwacht bijlageformaat: ${format}`));
                }
            });
        });

        // Alleen het gekozen bestand. keys[i] hoort bij files[i] — zo koppelen we het serverresultaat terug.
        const collectFiles = async item => {
            const files = [];
            const keys = [];
            const chosen = currentItems().filter(i => i.selectable && i.key === selectedKey);

            if (fileMode() === "mail" && chosen.length > 0 && !canReadAttachments()) {
                throw new Error("Bijlagen lezen wordt niet ondersteund in deze Outlook-versie.");
            }

            for (const entry of chosen) {
                if (entry.source === "attachment") {
                    const attachment = mailAttachments(item).find(a => `att:${a.id}` === entry.key);

                    files.push({
                        name: attachment.name,
                        contentType: attachment.contentType ?? "",
                        base64: await readAttachment(item, attachment.id),
                        source: "attachment"
                    });
                } else {
                    files.push({
                        name: entry.file.name,
                        contentType: entry.file.type ?? "",
                        base64: await readLocalFile(entry.file),
                        source: "upload"
                    });
                }

                keys.push(entry.key);
            }

            return { files, keys };
        };

        fileInput.addEventListener("change", () => {
            fileNotes = new Map();
            previewSelection();
        });

        document.querySelectorAll('input[name="fileMode"]').forEach(radio =>
            radio.addEventListener("change", previewSelection));

        copyJson.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(result.textContent);
                copyJson.textContent = "Gekopieerd ✓";
            } catch {
                // Fallback: tekst selecteren zodat de gebruiker Ctrl+C kan doen
                const range = document.createRange();
                range.selectNodeContents(result);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                copyJson.textContent = "Geselecteerd — Ctrl+C";
            }

            setTimeout(() => { copyJson.textContent = "Kopiëren"; }, 2000);
        });

        Office.onReady(info => {
            if (info.host !== Office.HostType.Outlook) {
                setStatus("Open deze pagina in Outlook.");
                return;
            }

            setStatus("Outlook is klaar.");
            button.disabled = false;
            previewSelection();
        });

        button.addEventListener("click", async () => {
            button.disabled = true;
            setStatus("Gegevens worden opgehaald...");
            resetFields();
            fileNotes = new Map();
            previewSelection();
            result.textContent = "Bezig...";

            try {
                const item = Office.context.mailbox.item;

                if (!item) {
                    throw new Error("Geen e-mail geselecteerd.");
                }

                const body = await new Promise((resolve, reject) => {
                    item.body.getAsync(
                        Office.CoercionType.Text,
                        response => response.status === Office.AsyncResultStatus.Succeeded
                            ? resolve(response.value)
                            : reject(new Error(response.error.message))
                    );
                });

                setStatus("Bestanden worden gelezen...");
                const { files, keys } = await collectFiles(item);

                setStatus("Gegevens worden geanalyseerd...");

                const response = await fetch("/api/mail/analyze", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        itemId: item.itemId,
                        subject: item.subject,
                        sender: item.from?.emailAddress,
                        body,
                        attachments: (item.attachments ?? []).map(file => ({
                            id: file.id,
                            name: file.name,
                            size: file.size,
                            contentType: file.contentType ?? ""
                        })),
                        files
                    })
                });

                const data = await response.json().catch(() => null);

                if (!response.ok) {
                    result.textContent = data ? JSON.stringify(data, null, 2) : "";
                    throw new Error(`Server error ${response.status}: ${data?.error ?? response.statusText}`);
                }

                FIELDS.forEach(([key]) => setField(key, data?.fields?.[key]));

                // Resultaat per bestand naast het juiste vinkje tonen
                fileNotes = new Map((data.files ?? []).map((f, i) => [keys[i], {
                    text: f.error ? `fout: ${f.error}` : `${f.characters} tekens gelezen`,
                    error: Boolean(f.error)
                }]));
                previewSelection();

                result.textContent = JSON.stringify(data, null, 2);

                setStatus(data.readyToSend
                    ? "Alle gegevens gevonden."
                    : "Gegevens ontvangen. Controleer de velden zonder groen label.");
            } catch (error) {
                setStatus(error.message, true);
                if (result.textContent === "Bezig...") result.textContent = error.message;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
