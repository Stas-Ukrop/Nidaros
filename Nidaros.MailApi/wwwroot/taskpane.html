<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nidaros Mail Assistant</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 16px;
            font-family: Arial, sans-serif;
            color: #242424;
            background: #fff;
        }

        h2 { margin: 0 0 8px; }
        h3 { margin: 20px 0 10px; font-size: 16px; }

        #status {
            margin: 0 0 16px;
            color: #666;
        }

        #status.error { color: #a1261b; font-weight: 600; }

        button {
            width: 100%;
            padding: 12px 16px;
            background: #176b52;
            color: #fff;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        button:disabled {
            opacity: .5;
            cursor: wait;
        }

        button.secondary {
            width: auto;
            padding: 6px 10px;
            background: #eee;
            color: #242424;
            font-size: 12px;
        }

        .files-box {
            display: grid;
            gap: 10px;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .files-box label { font-size: 13px; }

        .modes {
            display: grid;
            gap: 8px;
        }

        .mode {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
        }

        .mode:has(input:checked) {
            border-color: #176b52;
            background: #f1f8f5;
        }

        .hidden { display: none !important; }

        .files-box input[type="file"] {
            width: 100%;
            font: inherit;
            font-size: 13px;
        }

        .hint {
            margin: 0;
            font-size: 12px;
            color: #777;
        }

        #fileList {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 6px;
        }

        #fileList:empty { display: none; }

        #fileList li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            background: #f7f7f7;
            border-radius: 5px;
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        #fileList li.unchecked { opacity: .6; }

        .file-pick {
            display: flex;
            gap: 8px;
            align-items: center;
            cursor: pointer;
            min-width: 0;
        }

        .file-pick input { flex: none; margin: 0; }

        .file-note {
            flex: none;
            max-width: 45%;
            text-align: right;
            color: #555;
        }

        .file-note.error { color: #a1261b; }

        /* Alleen-lezen velden: worden door de server gevuld */
        .field {
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid #e1e1e1;
            border-radius: 6px;
        }

        .field-head {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            align-items: center;
            margin-bottom: 4px;
        }

        .field-label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
        }

        .field-value {
            min-height: 20px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .field-value.empty { color: #aaa; }

        .field-note {
            margin-top: 4px;
            font-size: 12px;
            color: #8a5a00;
        }

        .field-note:empty { display: none; }

        .confidence {
            padding: 3px 7px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .neutral { background: #eee; color: #555; }
        .green { background: #dff4e8; color: #176b52; }
        .orange { background: #fff0cf; color: #8a5a00; }
        .red { background: #fde1df; color: #a1261b; }

        details {
            margin-top: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        summary {
            padding: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .json-tools {
            display: flex;
            justify-content: flex-end;
            padding: 0 10px;
        }

        pre {
            margin: 10px;
            padding: 10px;
            max-height: 400px;
            overflow: auto;
            background: #f5f5f5;
            border-radius: 6px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 12px;
        }

        /* Bedieningselementen die tijdens het laden geblokkeerd worden */
        fieldset.plain {
            margin: 0;
            padding: 0;
            border: 0;
            min-width: 0;
        }

        /* Keuze: welke velden moeten terugkomen */
        .pick-box {
            margin: 0 0 16px;
        }

        .pick-box summary {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .pick-count {
            font-weight: 400;
            font-size: 12px;
            color: #666;
        }

        .pick-tools {
            display: flex;
            gap: 14px;
            padding: 0 10px 6px;
        }

        .link-button {
            width: auto;
            padding: 0;
            background: none;
            color: #176b52;
            font-weight: 600;
            font-size: 12px;
            text-decoration: underline;
        }

        .field-picker {
            display: grid;
            gap: 2px;
            padding: 0 10px 10px;
        }

        .field-picker label {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 5px 4px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }

        .field-picker label:hover { background: #f4f4f4; }

        .field-picker input { margin: 0; flex: none; }

        /* Knoppen */
        .actions {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
        }

        .actions .secondary {
            padding: 12px 14px;
            font-size: 14px;
        }

        button.secondary:disabled { opacity: .45; }

        button.danger {
            background: #fff;
            color: #a1261b;
            border: 1px solid #e0b4af;
        }

        /* Laadbalk */
        .progress {
            display: grid;
            gap: 8px;
        }

        .progress-track {
            height: 14px;
            border: 2px solid #242424;
            border-radius: 4px;
            overflow: hidden;
            background: #fff;
        }

        .progress-fill {
            width: 0;
            height: 100%;
            background: repeating-linear-gradient(-45deg, #176b52 0 6px, #3fa384 6px 12px);
            background-size: 17px 17px;
            transition: width .25s ease;
            animation: stripes .8s linear infinite;
        }

        @keyframes stripes {
            to { background-position: 17px 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .progress-fill { animation: none; transition: none; }
        }

        .progress-row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-size: 13px;
            color: #176b52;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <h2>Nidaros Mail Assistant</h2>
    <p id="status">Outlook wordt gestart...</p>

    <fieldset id="controls" class="plain">
    <h3>Bron van bestanden (PDF / DOCX / XML)</h3>

    <div class="files-box">
        <div class="modes">
            <label class="mode">
                <input type="radio" name="fileMode" value="mail" checked>
                Bijlagen uit deze e-mail
            </label>

            <label class="mode">
                <input type="radio" name="fileMode" value="pc">
                Bestand van computer
            </label>
        </div>

        <div id="pcBox" class="hidden">
            <input
                id="fileInput"
                type="file"
                accept=".pdf,.docx,.xml,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/xml,text/xml">
        </div>

        <p id="modeHint" class="hint"></p>

        <ul id="fileList"></ul>


        <p class="hint">Maximaal 10 MB per bestand. Gescande PDF's zonder tekstlaag worden niet gelezen.</p>
    </div>

    <details id="pickBox" class="pick-box">
        <summary>
            Velden die terug moeten komen
            <span id="pickCount" class="pick-count"></span>
        </summary>
        <div class="pick-tools">
            <button type="button" class="link-button" data-pick="all">Alles</button>
            <button type="button" class="link-button" data-pick="none">Niets</button>
        </div>
        <div id="fieldPicker" class="field-picker"></div>
    </details>
    </fieldset>

    <div id="actions" class="actions">
        <button id="analyze" type="button" disabled>Gegevens ophalen</button>
        <button id="reset" type="button" class="secondary" disabled>Annuleren</button>
    </div>

    <div id="progress" class="progress hidden" role="status" aria-live="polite">
        <div class="progress-track" role="progressbar" aria-label="Voortgang"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="progressFill" class="progress-fill"></div>
        </div>
        <div class="progress-row">
            <span id="progressLabel">Bezig...</span>
            <span id="progressPct">0%</span>
        </div>
        <button id="abort" type="button" class="danger">Afbreken</button>
    </div>

    <h3>Gegevens</h3>

    <!-- Velden worden uit FIELDS gegenereerd -->
    <div id="fields"></div>

    <details id="jsonBox" open>
        <summary>Volledige JSON</summary>
        <div class="json-tools">
            <button id="copyJson" class="secondary" type="button">Kopiëren</button>
        </div>
        <pre id="result">Nog geen gegevens.</pre>
    </details>

    <script>
        const MAX_FILE_BYTES = 10 * 1024 * 1024;

        // Velden volgens de opdracht (key = naam in de API-respons)
        const FIELDS = [
            ["name", "Naam"],
            ["address", "Adres"],
            ["postalCode", "Postcode"],
            ["city", "Woonplaats"],
            ["iban", "IBAN"],
            ["customerType", "Nieuwe klant of bestaande klant"],
            ["kvk", "KVK nummer"],
            ["vat", "BTW nummer"],
            ["invoiceNumber", "Factuurnummer"],
            ["article", "Welk artikel"],
            ["quantity", "Hoeveelheid"],
            ["deliveryDate", "Datum afname"],
            ["paymentDueDate", "Uiterste betalingsdatum"],
            ["paymentArrears", "Betalingsachterstanden binnen de eigen company"]
        ];

        const CUSTOMER_TYPE_LABELS = {
            new: "Nieuwe klant",
            existing: "Bestaande klant"
        };

        const button = document.getElementById("analyze");
        let officeReady = false;
        const status = document.getElementById("status");
        const result = document.getElementById("result");
        const fieldsBox = document.getElementById("fields");
        const fileInput = document.getElementById("fileInput");
        const pcBox = document.getElementById("pcBox");
        const modeHint = document.getElementById("modeHint");

        // "mail" = bijlagen uit de e-mail, "pc" = bestand van computer
        const fileMode = () => document.querySelector('input[name="fileMode"]:checked').value;

        const canReadAttachments = () =>
            Office.context?.requirements?.isSetSupported("Mailbox", "1.8") ?? false;

        const mailAttachments = item =>
            (item?.attachments ?? []).filter(a => !a.isInline && isSupported(a.name, a.contentType));
        const fileList = document.getElementById("fileList");
        const copyJson = document.getElementById("copyJson");

        const setStatus = (text, isError = false) => {
            status.textContent = text;
            status.classList.toggle("error", isError);
        };

        // Velden opbouwen (alleen-lezen)
        FIELDS.forEach(([key, label]) => {
            const field = document.createElement("div");
            field.className = "field";
            field.dataset.key = key;
            field.innerHTML = `
                <div class="field-head">
                    <span class="field-label"></span>
                    <span class="confidence neutral">Niet gecontroleerd</span>
                </div>
                <div class="field-value empty">—</div>
                <div class="field-note"></div>
            `;
            field.querySelector(".field-label").textContent = label;
            fieldsBox.append(field);
        });

        const confidenceState = confidence =>
            confidence === 100
                ? ["green", "100% zeker"]
                : confidence >= 75
                    ? ["orange", `${confidence}% twijfel`]
                    : confidence > 0
                        ? ["red", "Niet gevonden"]
                        : ["neutral", "Niet gecontroleerd"];

        const setField = (key, field) => {
            const container = fieldsBox.querySelector(`[data-key="${key}"]`);
            if (!container) return;

            const valueEl = container.querySelector(".field-value");
            const badge = container.querySelector(".confidence");
            const noteEl = container.querySelector(".field-note");

            let value = field?.value ?? "";
            if (key === "customerType") value = CUSTOMER_TYPE_LABELS[value] ?? value;

            valueEl.textContent = value || "—";
            valueEl.classList.toggle("empty", !value);

            // Uitleg van de server (bv. "IBAN-controlegetal klopt niet."), niet bij "missing"
            noteEl.textContent = field?.status !== "missing" ? (field?.note ?? "") : "";

            const [state, label] = field?.status === "error"
                ? ["red", "Fout"]
                : confidenceState(Number(field?.confidence ?? 0));
            badge.className = `confidence ${state}`;
            badge.textContent = label;
        };

        const resetFields = () => FIELDS.forEach(([key]) => setField(key, null));

        // ── Welke velden moeten terugkomen ──────────────────────────
        // Keuze wordt onthouden in deze browser (Outlook) — niet kritisch als dat mislukt.
        const PICK_STORAGE_KEY = "nidaros.requiredFields";
        const fieldPicker = document.getElementById("fieldPicker");
        const pickCount = document.getElementById("pickCount");

        const loadRequired = () => {
            try {
                const saved = JSON.parse(localStorage.getItem(PICK_STORAGE_KEY) ?? "null");
                const known = new Set(FIELDS.map(([key]) => key));
                if (Array.isArray(saved)) return new Set(saved.filter(k => known.has(k)));
            } catch { /* geen opslag beschikbaar */ }
            return new Set(FIELDS.map(([key]) => key));
        };

        const required = loadRequired();

        const saveRequired = () => {
            try { localStorage.setItem(PICK_STORAGE_KEY, JSON.stringify([...required])); }
            catch { /* negeren */ }
        };

        FIELDS.forEach(([key, label]) => {
            const row = document.createElement("label");
            const box = document.createElement("input");
            box.type = "checkbox";
            box.value = key;
            box.checked = required.has(key);
            box.addEventListener("change", () => {
                box.checked ? required.add(key) : required.delete(key);
                applyRequired();
            });
            row.append(box, document.createTextNode(label));
            fieldPicker.append(row);
        });

        // Toon alleen gekozen velden, werk teller en knop bij
        const applyRequired = () => {
            saveRequired();

            fieldPicker.querySelectorAll("input").forEach(box => { box.checked = required.has(box.value); });
            FIELDS.forEach(([key]) =>
                fieldsBox.querySelector(`[data-key="${key}"]`).classList.toggle("hidden", !required.has(key)));

            pickCount.textContent = `${required.size} van ${FIELDS.length}`;
            button.disabled = !officeReady || required.size === 0;

            if (officeReady && required.size === 0) {
                setStatus("Kies minstens één veld.", true);
            } else if (officeReady && status.classList.contains("error") && status.textContent === "Kies minstens één veld.") {
                setStatus("Outlook is klaar.");
            }
        };

        document.querySelectorAll("[data-pick]").forEach(link => link.addEventListener("click", () => {
            required.clear();
            if (link.dataset.pick === "all") FIELDS.forEach(([key]) => required.add(key));
            applyRequired();
        }));

        // PDF, DOCX, XML (oude .doc niet)
        const isSupported = (name = "", type = "") =>
            /\.(pdf|xml|docx)$/i.test(name) || /pdf|xml|wordprocessingml/i.test(type);

        const isOldDoc = (name = "", type = "") =>
            /\.doc$/i.test(name) || type === "application/msword";

        const formatSize = bytes =>
            bytes > 1024 * 1024
                ? `${(bytes / 1024 / 1024).toFixed(1)} MB`
                : `${Math.max(1, Math.round(bytes / 1024))} KB`;

        // Er wordt precies één bestand verwerkt.
        // Sleutel: "att:<id>" voor een bijlage, "pc:<naam>:<grootte>" voor een bestand van de computer.
        let selectedKey = null;

        // Resultaat na de laatste analyse: sleutel → { text, error }
        let fileNotes = new Map();

        const renderFileList = items => {
            fileList.innerHTML = "";

            // Keuzerondje alleen als er bij bijlagen echt iets te kiezen is
            const showPicker = fileMode() === "mail" && items.some(i => i.selectable);

            items.forEach(item => {
                const li = document.createElement("li");
                const pick = document.createElement("label");
                const name = document.createElement("span");
                const note = document.createElement("span");

                pick.className = "file-pick";
                note.className = "file-note";

                const sourceLabel = item.source === "attachment" ? "bijlage" : "upload";
                name.textContent = `${item.name} (${sourceLabel}${item.size ? ", " + formatSize(item.size) : ""})`;

                const isChosen = item.selectable && item.key === selectedKey;

                if (showPicker) {
                    const radio = document.createElement("input");
                    radio.type = "radio";
                    radio.name = "attachmentPick";
                    radio.checked = isChosen;
                    radio.disabled = !item.selectable;
                    radio.addEventListener("change", () => {
                        selectedKey = item.key;
                        previewSelection();
                    });
                    pick.append(radio);
                }

                li.classList.toggle("unchecked", !isChosen);
                pick.append(name);

                const result = fileNotes.get(item.key);
                note.textContent = result?.text ?? item.note ?? "";
                note.classList.toggle("error", Boolean(result?.error) || (!item.selectable && Boolean(item.note)));

                li.append(pick, note);
                fileList.append(li);
            });
        };

        const updateHint = items => {
            const selectable = items.filter(i => i.selectable).length;
            const chosen = items.find(i => i.selectable && i.key === selectedKey);

            if (fileMode() === "mail" && !canReadAttachments()) {
                modeHint.textContent = "Deze Outlook-versie kan bijlagen niet lezen. Kies 'Bestand van computer'.";
            } else if (fileMode() === "mail") {
                modeHint.textContent = selectable === 0
                    ? "Geen PDF/DOCX/XML bijlagen in deze e-mail. Alleen de tekst van de e-mail wordt gelezen."
                    : selectable === 1
                        ? "Het bestand wordt direct uit de e-mail gelezen, zonder downloaden."
                        : `Kies één van de ${selectable} bijlagen om te verwerken.`;
            } else {
                modeHint.textContent = items.length === 0
                    ? "Kies één bestand. Bijlagen uit de e-mail worden genegeerd."
                    : chosen ? "" : "Dit bestand kan niet worden verwerkt. Kies een ander bestand.";
            }
        };

        // Huidige lijst bestanden voor de gekozen modus
        const currentItems = () => {
            const item = Office.context?.mailbox?.item;

            if (fileMode() === "mail") {
                return mailAttachments(item).map(a => ({
                    key: `att:${a.id}`,
                    name: a.name,
                    size: a.size,
                    source: "attachment",
                    selectable: a.size <= MAX_FILE_BYTES,
                    note: a.size > MAX_FILE_BYTES ? "te groot" : ""
                }));
            }

            const f = fileInput.files?.[0];

            if (!f) return [];

            const problem = isOldDoc(f.name, f.type)
                ? "sla op als .docx"
                : !isSupported(f.name, f.type)
                    ? "niet ondersteund"
                    : f.size > MAX_FILE_BYTES ? "te groot" : "";

            return [{
                key: `pc:${f.name}:${f.size}`,
                name: f.name,
                size: f.size,
                source: "upload",
                selectable: !problem,
                note: problem,
                file: f
            }];
        };

        // Keuze ongeldig of nog niet gemaakt → eerste bruikbare bestand
        const ensureSelection = items => {
            if (!items.some(i => i.selectable && i.key === selectedKey)) {
                selectedKey = items.find(i => i.selectable)?.key ?? null;
            }
        };

        const previewSelection = () => {
            pcBox.classList.toggle("hidden", fileMode() !== "pc");

            const items = currentItems();
            ensureSelection(items);
            renderFileList(items);
            updateHint(items);
        };

        const readLocalFile = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result).split(",")[1] ?? "");
            reader.onerror = () => reject(new Error(`Kan ${file.name} niet lezen.`));
            reader.readAsDataURL(file);
        });

        // Outlook-bijlage -> base64 (vereist Mailbox 1.8)
        const readAttachment = (item, attachmentId) => new Promise((resolve, reject) => {
            item.getAttachmentContentAsync(attachmentId, response => {
                if (response.status !== Office.AsyncResultStatus.Succeeded) {
                    reject(new Error(response.error.message));
                    return;
                }

                const { format, content } = response.value;

                if (format === Office.MailboxEnums.AttachmentContentFormat.Base64) {
                    resolve(content);
                } else {
                    reject(new Error(`Onverwacht bijlageformaat: ${format}`));
                }
            });
        });

        // Alleen het gekozen bestand. keys[i] hoort bij files[i] — zo koppelen we het serverresultaat terug.
        const collectFiles = async item => {
            const files = [];
            const keys = [];
            const chosen = currentItems().filter(i => i.selectable && i.key === selectedKey);

            if (fileMode() === "mail" && chosen.length > 0 && !canReadAttachments()) {
                throw new Error("Bijlagen lezen wordt niet ondersteund in deze Outlook-versie.");
            }

            for (const entry of chosen) {
                if (entry.source === "attachment") {
                    const attachment = mailAttachments(item).find(a => `att:${a.id}` === entry.key);

                    files.push({
                        name: attachment.name,
                        contentType: attachment.contentType ?? "",
                        base64: await readAttachment(item, attachment.id),
                        source: "attachment"
                    });
                } else {
                    files.push({
                        name: entry.file.name,
                        contentType: entry.file.type ?? "",
                        base64: await readLocalFile(entry.file),
                        source: "upload"
                    });
                }

                keys.push(entry.key);
            }

            return { files, keys };
        };

        fileInput.addEventListener("change", () => {
            fileNotes = new Map();
            previewSelection();
        });

        document.querySelectorAll('input[name="fileMode"]').forEach(radio =>
            radio.addEventListener("change", previewSelection));

        copyJson.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(result.textContent);
                copyJson.textContent = "Gekopieerd ✓";
            } catch {
                // Fallback: tekst selecteren zodat de gebruiker Ctrl+C kan doen
                const range = document.createRange();
                range.selectNodeContents(result);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                copyJson.textContent = "Geselecteerd — Ctrl+C";
            }

            setTimeout(() => { copyJson.textContent = "Kopiëren"; }, 2000);
        });

        Office.onReady(info => {
            if (info.host !== Office.HostType.Outlook) {
                setStatus("Open deze pagina in Outlook.");
                return;
            }

            officeReady = true;
            setStatus("Outlook is klaar.");
            previewSelection();
            applyRequired();
        });

        // ── Laden, voortgang, afbreken ──────────────────────────────
        const controls = document.getElementById("controls");
        const actions = document.getElementById("actions");
        const resetButton = document.getElementById("reset");
        const progress = document.getElementById("progress");
        const progressTrack = progress.querySelector(".progress-track");
        const progressFill = document.getElementById("progressFill");
        const progressLabel = document.getElementById("progressLabel");
        const progressPct = document.getElementById("progressPct");
        const abortButton = document.getElementById("abort");

        class Cancelled extends Error {}

        // Huidige run: { cancelled, xhr }. Eén tegelijk.
        let run = null;

        const setProgress = (percent, label) => {
            const value = Math.max(0, Math.min(100, Math.round(percent)));
            progressFill.style.width = `${value}%`;
            progressTrack.setAttribute("aria-valuenow", String(value));
            progressPct.textContent = `${value}%`;
            if (label) progressLabel.textContent = label;
        };

        const setBusy = busy => {
            controls.disabled = busy;
            actions.classList.toggle("hidden", busy);
            progress.classList.toggle("hidden", !busy);
            abortButton.disabled = false;
            abortButton.textContent = "Afbreken";
        };

        // Gooit Cancelled als de gebruiker intussen op "Afbreken" heeft gedrukt
        const checkCancelled = current => {
            if (current.cancelled) throw new Cancelled();
        };

        // XHR i.p.v. fetch: geeft echte upload-voortgang én kan worden afgebroken
        const postJson = (url, payload, current, onUpload) => new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            current.xhr = xhr;

            xhr.open("POST", url);
            xhr.setRequestHeader("Content-Type", "application/json");
            xhr.timeout = 120000;

            xhr.upload.onprogress = e => { if (e.lengthComputable) onUpload(e.loaded / e.total); };
            xhr.upload.onload = () => onUpload(1);

            xhr.onload = () => {
                let data = null;
                try { data = JSON.parse(xhr.responseText); } catch { /* geen JSON */ }
                resolve({ ok: xhr.status >= 200 && xhr.status < 300, status: xhr.status, statusText: xhr.statusText, data });
            };
            xhr.onerror = () => reject(new Error("Netwerkfout: de server is niet bereikbaar."));
            xhr.ontimeout = () => reject(new Error("De server reageert niet (time-out)."));
            xhr.onabort = () => reject(new Cancelled());

            xhr.send(JSON.stringify(payload));
        });

        const countFound = data =>
            Object.values(data?.fields ?? {}).filter(f => f.confidence === 100).length;

        button.addEventListener("click", async () => {
            const current = { cancelled: false, xhr: null };
            run = current;

            setBusy(true);
            setProgress(0, "Starten...");

            // Lijst met velden inklappen, zodat de laadbalk en resultaten in beeld zijn
            document.getElementById("pickBox").open = false;
            progress.scrollIntoView({ block: "nearest" });
            setStatus("Gegevens worden opgehaald...");
            resetFields();
            fileNotes = new Map();
            previewSelection();
            result.textContent = "Bezig...";

            try {
                const item = Office.context.mailbox.item;

                if (!item) {
                    throw new Error("Geen e-mail geselecteerd.");
                }

                setProgress(5, "E-mail lezen...");
                const body = await new Promise((resolve, reject) => {
                    item.body.getAsync(
                        Office.CoercionType.Text,
                        response => response.status === Office.AsyncResultStatus.Succeeded
                            ? resolve(response.value)
                            : reject(new Error(response.error.message))
                    );
                });
                checkCancelled(current);

                setProgress(15, fileMode() === "mail" ? "Bijlage lezen..." : "Bestand lezen...");
                const { files, keys } = await collectFiles(item);
                checkCancelled(current);

                // 30–80%: echte upload-voortgang
                setProgress(30, files.length ? "Bestand versturen..." : "Versturen...");
                const response = await postJson("/api/mail/analyze", {
                    itemId: item.itemId,
                    subject: item.subject,
                    sender: item.from?.emailAddress,
                    body,
                    attachments: (item.attachments ?? []).map(file => ({
                        id: file.id,
                        name: file.name,
                        size: file.size,
                        contentType: file.contentType ?? ""
                    })),
                    files,
                    requestedFields: FIELDS.map(([key]) => key).filter(key => required.has(key))
                }, current, fraction => {
                    setProgress(30 + fraction * 50, fraction < 1 ? "Bestand versturen..." : "Gegevens worden geanalyseerd...");
                });
                checkCancelled(current);

                const data = response.data;

                if (!response.ok) {
                    result.textContent = data ? JSON.stringify(data, null, 2) : "";
                    throw new Error(`Server error ${response.status}: ${data?.error ?? response.statusText}`);
                }

                setProgress(100, "Klaar");

                FIELDS.forEach(([key]) => setField(key, data?.fields?.[key]));

                // Resultaat naast het gekozen bestand tonen
                fileNotes = new Map((data.files ?? []).map((f, i) => [keys[i], {
                    text: f.error ? `fout: ${f.error}` : `${f.characters} tekens gelezen`,
                    error: Boolean(f.error)
                }]));
                previewSelection();

                result.textContent = JSON.stringify(data, null, 2);

                const total = Object.keys(data.fields ?? {}).length;
                setStatus(data.readyToSend
                    ? `Alle verplichte velden gevonden (${total} van ${total}).`
                    : `${countFound(data)} van ${total} verplichte velden zeker gevonden. Controleer de velden zonder groen label.`);
            } catch (error) {
                if (error instanceof Cancelled) {
                    // Afgebroken: velden leeg laten, niets half tonen
                    resetFields();
                    fileNotes = new Map();
                    previewSelection();
                    result.textContent = "Afgebroken.";
                    setStatus("Laden afgebroken.");
                } else if (run === current) {
                    setStatus(error.message, true);
                    if (result.textContent === "Bezig...") result.textContent = error.message;
                }
            } finally {
                if (run === current) {
                    run = null;
                    setBusy(false);
                    resetButton.disabled = false;
                }
            }
        });

        // "Afbreken": stopt de lopende aanvraag. Office.js-aanroepen zelf kunnen niet
        // worden gestopt, maar hun resultaat wordt dan genegeerd.
        abortButton.addEventListener("click", () => {
            if (!run) return;
            run.cancelled = true;
            abortButton.disabled = true;
            abortButton.textContent = "Afbreken...";
            run.xhr?.abort();
        });

        // "Annuleren": alles terug naar de beginstand (veldkeuze blijft bewaard)
        resetButton.addEventListener("click", () => {
            resetFields();
            fileNotes = new Map();
            previewSelection();
            result.textContent = "Nog geen gegevens.";
            setStatus("Outlook is klaar.");
            resetButton.disabled = true;
        });

        applyRequired();
    </script>
</body>
</html>
